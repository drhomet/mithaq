name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Runs the project and its dependencies, so it holds no token that can publish or write.
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: [17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mithaq
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Not 5432 or 55439, which testDatabase refuses as dev databases; the tests drop and rebuild it.
      DATABASE_URL: postgres://postgres:postgres@localhost:55432/mithaq
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint:args
      - run: bun run test
      - run: bun run test:tanstack
      - run: bun run test:next
      - run: bunx mithaq generate --check
        working-directory: templates/asas
      # Each folder that holds files from mithaq-admin, which its components.json places.
      - run: for folder in templates/mithaq apps/asas-tanstack apps/asas-backoffice; do (cd "$folder" && bunx mithaq upgrade --check) || exit 1; done
      - name: Install Chromium for native auth checks
        run: |
          node node_modules/playwright-core/cli.js install --with-deps chromium
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs'
          import { chromium } from 'playwright-core'
          appendFileSync(process.env.GITHUB_ENV, `AUTH_BROWSER_EXECUTABLE=${chromium.executablePath()}\n`)
          JS
      # Stages .pack/, which is what gets published.
      - run: bun run test:release
      # Artifacts are immutable within a run, so publish gets exactly what these checks passed.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.postgres == 17
        with:
          name: pack
          path: .pack/
          # .pack itself starts with a dot, and the template holds dotfiles.
          include-hidden-files: true
          if-no-files-found: error

  # Holds the publishing token, so it runs no project or dependency code: only Node, npm and apps/release.ts, which imports builtins only.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    # The owner approves each run here, and npm trusts only this workflow in this environment.
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The previous tag for the notes, and origin/main to check the tag is on it.
          fetch-depth: 0
          persist-credentials: false
      # No registry-url: its .npmrc names a token, and this job publishes through OIDC with none.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pack
          path: .pack
      # Trusted publishing needs npm 11.5.1 or later; pinned so the publishing CLI changes only in a reviewed commit.
      - run: npm install -g --ignore-scripts npm@11.21.0
      - run: node apps/release.ts --publish
      - run: gh release create "$GITHUB_REF_NAME" --notes-file .pack/release-notes.md --verify-tag --prerelease="$([[ "$GITHUB_REF_NAME" == *-* ]] && echo true || echo false)"
        env:
          GH_TOKEN: ${{ github.token }}
